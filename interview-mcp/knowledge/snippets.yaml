  - id: string_split
    name: String to List
    keywords: [split, string, list, delimiter, parse]
    pattern: String parsing
    time_complexity: "O(n)"
    space_complexity: "O(n)"
    complexity_explanation: >-
      split scans the string once and builds a list of substrings. n = string length.
      Output list can hold up to n tokens in the worst case.
    code: |
      lis = string.split("-")
    notes:
      - "Use split() for single delimiter; regex for complex patterns."
      - "Say aloud: one pass, linear time."

  - id: balanced_brackets_replace
    name: Balanced Brackets (replace approach)
    keywords: [balanced, brackets, parentheses, valid, stack]
    pattern: Stack / string reduction
    time_complexity: "O(n * k) worst case, k = number of bracket types"
    space_complexity: "O(n) for intermediate strings"
    complexity_explanation: >-
      Each while-loop pass scans the full string; replace creates new strings.
      Interviewers prefer stack O(n) time, O(n) space. Know both; lead with stack if asked to optimize.
    code: |
      def isBalanced(my_string):
          brackets = ['()', '{}', '[]']
          while any(x in my_string for x in brackets):
              for br in brackets:
                  my_string = my_string.replace(br, '')
          return 'YES' if len(my_string) == 0 else 'NO'
    optimal_approach: |
      def isBalanced(s):
          stack = []
          pairs = {')': '(', '}': '{', ']': '['}
          for ch in s:
              if ch in '({[':
                  stack.append(ch)
              elif ch in ')}]':
                  if not stack or stack.pop() != pairs[ch]:
                      return 'NO'
          return 'YES' if not stack else 'NO'
    optimal_complexity: "Time O(n), Space O(n)"
    notes:
      - "Stack: push openers, pop and match on closers."
      - "Replace approach works for small inputs but is not optimal."

  - id: tree_height
    name: Binary Tree Height
    keywords: [height, depth, binary tree, recursive, tree]
    pattern: DFS recursion
    time_complexity: "O(n)"
    space_complexity: "O(h) recursion stack, h = height"
    complexity_explanation: >-
      Visits every node once. Space is call-stack depth; O(n) worst case for skewed tree, O(log n) for balanced.
    code: |
      def height(root):
          if root is None:
              return -1
          return 1 + max(height(root.left), height(root.right))
    notes:
      - "Base case None returns -1 so single node height is 0."
      - "Mention skewed vs balanced when stating space complexity."

  - id: graph_bfs_distances
    name: Graph BFS Shortest Distances (unweighted)
    keywords: [graph, bfs, dijkstra, distance, shortest, hackerrank, nodes, edges]
    pattern: BFS
    time_complexity: "O(V + E)"
    space_complexity: "O(V)"
    complexity_explanation: >-
      This is BFS on an unweighted graph, not Dijkstra. Each node and edge visited once.
      Queue + visited set are O(V). Edge weight 6 is constant offset per level.
    code: |
      class Graph:
          def __init__(self, n):
              self.n = n
              self.edges = [[] for _ in range(n)]
              self.distances = [-1 for _ in range(n)]

          def connect(self, x, y):
              self.edges[x].append(y)
              self.edges[y].append(x)

          def find_all_distances(self, s):
              visited = set()
              to_look = [(s, 0)]

              def append_look(item, acum_d):
                  visited.add(item)
                  self.distances[item] = acum_d
                  for n in self.edges[item]:
                      if n not in visited:
                          to_look.append((n, acum_d + 6))

              while to_look:
                  n, d = to_look.pop(0)
                  append_look(n, d)

              self.distances.pop(s)
              print(" ".join(map(str, self.distances)))
    notes:
      - "Call it BFS, not Dijkstra — no priority queue needed for equal/unweighted edges."
      - "pop(0) on list is O(n); collections.deque popleft() is O(1) if optimized."
      - "Say: O(V+E) time, O(V) space for visited + queue."

  - id: level_order_bfs
    name: Binary Tree Level Order (BFS)
    keywords: [level order, bfs, queue, tree, traversal]
    pattern: BFS with queue
    time_complexity: "O(n)"
    space_complexity: "O(w) where w = max level width"
    complexity_explanation: >-
      Each node enqueued and dequeued once. Queue holds at most one level; widest level drives space.
    code: |
      class Queue:
          def __init__(self):
              self.n = []

          def add_queue(self, data):
              self.n.append(data)

          def remove_queue(self):
              front = self.n[0]
              del self.n[0]
              return front

          def is_empty(self):
              return not bool(len(self.n))

      def levelOrder(root):
          q = Queue()
          q.add_queue(root)

          while not q.is_empty():
              root = q.remove_queue()
              print(root.info, end=' ')

              if root.left:
                  q.add_queue(root.left)
              if root.right:
                  q.add_queue(root.right)
    notes:
      - "For level-by-level output, track level size or use sentinel node."
      - "collections.deque is preferred over list pop(0)."

  - id: trie_contacts
    name: Trie / Contacts Prefix Count
    keywords: [trie, contacts, prefix, autocomplete, dictionary]
    pattern: Trie
    time_complexity: "O(L) per add/find, L = word length"
    space_complexity: "O(total characters stored)"
    complexity_explanation: >-
      Each add/find walks one character at a time. memo counts prefixes at each node.
      Space grows with unique prefix tree structure.
    code: |
      class Contacts:
          def __init__(self):
              self.end_of_word = 0
              self.children = {}
              self.memo = 0

          def add(self, cursor, word):
              for letter in word:
                  if cursor.children.get(letter) is None:
                      cursor.children[letter] = Contacts()
                  cursor = cursor.children[letter]
                  cursor.memo = cursor.memo + 1
              cursor.end_of_word = 1

          def find(self, cursor, partial):
              for letter in partial:
                  cursor = cursor.children.get(letter)
                  if cursor is None:
                      return 0
              return cursor.memo

          def contacts(self, queries):
              contacts_list = Contacts()
              countList = []
              for query_type, query_value in queries:
                  if query_type == 'add':
                      self.add(contacts_list, query_value)
                  else:
                      pCount = self.find(contacts_list, query_value)
                      countList.append(pCount)
              return countList
    notes:
      - "memo at each node = count of words passing through that prefix."
      - "Say O(L) per query; m queries → O(m * L)."

  - id: running_median
    name: Running Median (bisect)
    keywords: [median, running, bisect, insort, stream, sorted list]
    pattern: Sorted list + bisect
    time_complexity: "O(n^2) with list insort; O(n log n) with balanced heap"
    space_complexity: "O(n)"
    complexity_explanation: >-
      bisect.insort on a Python list is O(n) per insert due to shifting.
      n inserts → O(n^2). Two-heap approach achieves O(n log n) time, O(n) space.
    code: |
      import bisect

      def runningMedian(a, p=[], q=[], l=0):
          for i in range(len(a)):
              l = l + 1
              bisect.insort(p, a[i])
              if l % 2 == 1:
                  q.append(p[l // 2])
              else:
                  q.append((p[l // 2] + p[l // 2 - 1]) / 2)
          return q
    optimal_approach: |
      # Two heaps: max-heap for lower half, min-heap for upper half
      # Each insert O(log n) → total O(n log n)
    optimal_complexity: "Time O(n log n), Space O(n)"
    notes:
      - "Know the O(n^2) cost of list insort; mention two-heap upgrade."
      - "Even index: average of two middles; odd: middle element."

  - id: swap_nodes_level
    name: Swap Nodes at Depth (mod h)
    keywords: [swap, tree, inorder, depth, level, hackerrank]
    pattern: DFS + conditional swap
    time_complexity: "O(n) per query, q queries → O(n * q)"
    space_complexity: "O(h) recursion depth"
    complexity_explanation: >-
      inOrderSwap visits each node once per query. String concat in recursion adds overhead
      but visit count is O(n) per swap height h.
    code: |
      def inOrderSwap(indexes, root, depth, h):
          s = ' '
          if depth % h == 0:
              indexes[root - 1][0], indexes[root - 1][1] = indexes[root - 1][1], indexes[root - 1][0]
          if indexes[root - 1][0] != -1:
              s = s + inOrderSwap(indexes, indexes[root - 1][0], depth + 1, h)
          s = s + ' ' + str(root)
          if indexes[root - 1][1] != -1:
              s = s + inOrderSwap(indexes, indexes[root - 1][1], depth + 1, h)
          return s

      def swapNodes(indexes, queries):
          return (inOrderSwap(indexes, 1, 1, h).split() for h in queries)
    notes:
      - "Swap children at depths divisible by h before recursive inorder walk."
      - "1-indexed tree in problem; adjust for 0-indexed arrays."

  - id: fizzbuzz
    name: FizzBuzz
    keywords: [fizzbuzz, fizz, buzz, modulo]
    pattern: Simple iteration
    time_complexity: "O(n)"
    space_complexity: "O(1) excluding output"
    complexity_explanation: Single loop 1..n, constant work per number.
    code: |
      def fizzBuzz(n):
          for i in range(1, n + 1):
              buzzes = []
              if i % 3 == 0:
                  buzzes.append("Fizz")
              if i % 5 == 0:
                  buzzes.append("Buzz")
              if buzzes:
                  print("".join(buzzes))
              else:
                  print(i)
    notes:
      - "Alternative: single expression without list — print('Fizz' if ... else i)."
      - "Trivial O(n) — focus on clean readability."

  - id: enumerate_parse
    name: Enumerate + Parse Nested Input
    keywords: [enumerate, parse, split, nested, input, matrix]
    pattern: Input parsing
    time_complexity: "O(n * m) for n rows, m tokens per row"
    space_complexity: "O(n * m)"
    complexity_explanation: Each row joined and split once; int conversion per token.
    code: |
      arr = [["1 2"], ["3"]]
      obj = []

      for i, f in enumerate(arr):
          data = " ".join(f).split()
          new_data = [int(x) for x in data]
          obj.append({"id": i + 1, "data": new_data})
    notes:
      - "enumerate gives index + value without manual counter."
      - "join nested lists before split when input is grouped."

