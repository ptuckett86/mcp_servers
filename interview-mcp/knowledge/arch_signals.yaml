signals:
  - name: CRUD API
    keywords:
      - crud
      - rest
      - api
      - endpoint
      - resource
      - create
      - update
      - delete
    components:
      - REST API layer (FastAPI/Express)
      - Relational database (Postgres)
      - Connection pool
    tradeoffs:
      - Start monolith; split services only when team/scale demands
      - Use DTOs/schemas to decouple API from DB models
    aws_mapping:
      api: API Gateway or ALB + ECS/Lambda
      database: RDS Postgres
    bottlenecks:
      - N+1 queries without eager loading
      - Missing pagination on list endpoints

  - name: File Upload
    keywords:
      - upload
      - file
      - image
      - s3
      - blob
      - storage
      - presigned
    components:
      - Object storage (S3)
      - Metadata DB for file records
      - Optional CDN for delivery
    tradeoffs:
      - Direct-to-S3 presigned URLs offload bandwidth from API
      - Virus scan / size limits at upload boundary
    aws_mapping:
      storage: S3
      cdn: CloudFront
      processing: Lambda on S3 events
    bottlenecks:
      - Streaming large files through API server
      - No lifecycle policy on stale uploads

  - name: Async Jobs
    keywords:
      - queue
      - async
      - background
      - worker
      - job
      - sqs
      - notification
      - email
    components:
      - Message queue (SQS/RabbitMQ)
      - Worker service
      - Dead-letter queue
    tradeoffs:
      - At-least-once delivery requires idempotent workers
      - Eventual consistency for side effects
    aws_mapping:
      queue: SQS
      worker: ECS/Lambda
      dlq: SQS DLQ
    bottlenecks:
      - Poison messages without DLQ
      - Synchronous email/SMS in request path

  - name: High Read QPS
    keywords:
      - read-heavy
      - cache
      - redis
      - scale reads
      - hot key
      - qps
      - popular
    components:
      - Read replica or cache (Redis)
      - Cache-aside pattern
      - CDN for static content
    tradeoffs:
      - Cache invalidation complexity vs DB load reduction
      - Stale reads acceptable for many read-heavy workloads
    aws_mapping:
      cache: ElastiCache Redis
      database: RDS read replicas
      cdn: CloudFront
    bottlenecks:
      - Cache stampede on hot keys
      - Single primary DB for all writes and reads

  - name: Strong Consistency
    keywords:
      - transaction
      - consistency
      - atomic
      - borrow
      - inventory
      - stock
      - lock
      - race
    components:
      - ACID database transactions
      - Row-level locking or optimistic concurrency (version column)
      - Idempotency keys for retries
    tradeoffs:
      - Strong consistency limits horizontal write scaling
      - Serializable isolation vs performance
    aws_mapping:
      database: RDS Postgres with transactions
      locking: SELECT FOR UPDATE or DynamoDB conditional writes
    bottlenecks:
      - Double-spend / double-borrow without locking
      - Long transactions blocking hot rows

  - name: Multi-Copy Inventory
    keywords:
      - library
      - borrow
      - return
      - copy
      - copies
      - reservation
      - checkout
      - catalog
    components:
      - books/items table + copies table (1-to-many)
      - borrow_records with status lifecycle
      - Availability query with copy count
    tradeoffs:
      - Normalize copies vs denormalized available_count (trade consistency for speed)
      - Reservation hold timeout to release stale locks
    aws_mapping:
      database: RDS Postgres
      events: SQS for overdue reminders
    bottlenecks:
      - Updating available_count without transaction
      - No unique constraint preventing duplicate active borrows per copy

  - name: Rate Limiting
    keywords:
      - rate limit
      - throttle
      - quota
      - abuse
      - ddos
      - per user
    components:
      - Token bucket or sliding window counter (Redis)
      - API gateway rate limits
    tradeoffs:
      - Per-IP vs per-user vs per-API-key limits
      - Hard reject vs queue/delay
    aws_mapping:
      gateway: API Gateway usage plans
      cache: ElastiCache for counters
    bottlenecks:
      - Rate limit state on single Redis node
      - No distinction between burst and sustained traffic

  - name: Authentication
    keywords:
      - auth
      - login
      - jwt
      - oauth
      - session
      - permission
      - role
    components:
      - Auth service or middleware
      - JWT or session store
      - RBAC/ABAC for authorization
    tradeoffs:
      - Stateless JWT vs revocable server sessions
      - OAuth for third-party vs first-party credentials
    aws_mapping:
      auth: Cognito or custom + Secrets Manager
      sessions: DynamoDB or Redis
    bottlenecks:
      - JWT in every service without centralized validation
      - Storing passwords without proper hashing (bcrypt/argon2)

  - name: Event-Driven
    keywords:
      - event
      - publish
      - subscribe
      - webhook
      - fan-out
      - stream
      - kafka
    components:
      - Event bus (SNS/Kafka)
      - Subscribers / consumers
      - Event schema registry
    tradeoffs:
      - Eventual consistency and ordering guarantees per partition
      - Choreography vs orchestration
    aws_mapping:
      bus: SNS + SQS fan-out
      stream: Kinesis or MSK
    bottlenecks:
      - No schema versioning on events
      - Cyclic event dependencies between services

  - name: Multi-Tenant
    keywords:
      - multi-tenant
      - tenant
      - organization
      - workspace
      - isolation
    components:
      - tenant_id on all rows or schema-per-tenant
      - Row-level security or middleware scoping
    tradeoffs:
      - Shared DB simpler ops; isolated DB stronger isolation
      - Always filter queries by tenant_id
    aws_mapping:
      database: RDS with RLS or separate schemas
      isolation: VPC per large tenant (enterprise)
    bottlenecks:
      - Missing tenant_id in queries (data leak)
      - Noisy neighbor on shared infrastructure
