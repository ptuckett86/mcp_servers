patterns:
  - name: Sliding Window
    signals:
      - substring
      - subarray
      - contiguous
      - window
      - longest
      - shortest
      - at most k
      - at least k
      - repeating
      - distinct
    approach: Maintain a window with two pointers; expand right, shrink left when constraint breaks.
    complexity: "Time O(n), Space O(k) for frequency map"
    pitfalls:
      - Forgetting to update window state when shrinking
      - Off-by-one on window boundaries
      - Not handling empty input
    example_problems:
      - Longest substring without repeating characters
      - Minimum window substring
      - Max sum subarray of size k

  - name: Two Pointers
    signals:
      - sorted array
      - pair
      - triplet
      - palindrome
      - opposite ends
      - merge
      - remove duplicates
    approach: Use left/right pointers moving inward or two cursors through sorted/partitioned data.
    complexity: "Time O(n), Space O(1)"
    pitfalls:
      - Requires sorted input or explicit sort step
      - Skipping duplicate triplets in 3Sum-style problems
      - Pointer movement conditions must be mutually exclusive
    example_problems:
      - Two sum II
      - Container with most water
      - Valid palindrome

  - name: Binary Search
    signals:
      - sorted
      - find minimum
      - find maximum
      - rotated
      - search space
      - monotonic
      - peak
      - boundary
    approach: Halve search space using compare predicate; watch for overflow and inclusive/exclusive bounds.
    complexity: "Time O(log n), Space O(1)"
    pitfalls:
      - Infinite loops from incorrect mid calculation
      - Confusing lower_bound vs upper_bound
      - Applying to unsorted data without monotonic predicate
    example_problems:
      - Search in rotated sorted array
      - Find peak element
      - Koko eating bananas

  - name: BFS
    signals:
      - shortest path
      - level order
      - minimum steps
      - unweighted graph
      - grid
      - spread
      - nearest
    approach: Queue-based layer-by-layer traversal; track visited to avoid cycles.
    complexity: "Time O(V+E) or O(m*n), Space O(V) or O(m*n)"
    pitfalls:
      - Not marking visited on enqueue (re-enqueue loops)
      - Using BFS on weighted graphs without modification
      - Forgetting to handle disconnected components
    example_problems:
      - Word ladder
      - Rotting oranges
      - Shortest path in binary matrix

  - name: DFS
    signals:
      - tree
      - graph
      - path
      - connected components
      - explore all
      - backtrack
      - island
    approach: Recursive or stack-based deep traversal; use visited set or path tracking as needed.
    complexity: "Time O(V+E), Space O(V) for recursion/stack"
    pitfalls:
      - Stack overflow on deep graphs without iterative DFS
      - Mutating visited state incorrectly in backtracking
      - Confusing tree DFS with graph cycle handling
    example_problems:
      - Number of islands
      - Path sum
      - Clone graph

  - name: Topological Sort
    signals:
      - prerequisite
      - dependency
      - course schedule
      - ordering
      - dag
      - before
      - after
    approach: Kahn's BFS (in-degree) or DFS post-order on DAG; detect cycles if ordering impossible.
    complexity: "Time O(V+E), Space O(V)"
    pitfalls:
      - Cycle detection missing in course schedule
      - Building adjacency in wrong direction
      - Assuming undirected graph
    example_problems:
      - Course schedule
      - Alien dictionary
      - Build order

  - name: Union-Find
    signals:
      - connected components
      - union
      - merge groups
      - network
      - redundant connection
      - dynamic connectivity
    approach: Disjoint set with path compression and union by rank/size.
    complexity: "Time ~O(alpha(n)) per op, Space O(n)"
    pitfalls:
      - Not compressing paths (TLE on large inputs)
      - Off-by-one indexing in 1-indexed problems
      - Using when edges need ordering info
    example_problems:
      - Number of connected components
      - Redundant connection
      - Accounts merge

  - name: Dynamic Programming
    signals:
      - maximum
      - minimum
      - count ways
      - optimal substructure
      - overlapping subproblems
      - knapsack
      - sequence
      - dp
    approach: Define state, recurrence, base cases; choose top-down memo or bottom-up tabulation.
    complexity: "Time O(states * transitions), Space O(states)"
    pitfalls:
      - Wrong state definition leading to exponential recursion
      - Forgetting base cases
      - Space optimization breaking dependency order
    example_problems:
      - Coin change
      - Longest increasing subsequence
      - Edit distance

  - name: Heap / Priority Queue
    signals:
      - k largest
      - k smallest
      - top k
      - median
      - merge k
      - schedule
      - priority
    approach: Min-heap for k largest, max-heap for k smallest; lazy deletion when needed.
    complexity: "Time O(n log k), Space O(k)"
    pitfalls:
      - Using full sort when heap suffices
      - Wrong heap type (min vs max)
      - Not handling ties consistently
    example_problems:
      - Kth largest element
      - Merge k sorted lists
      - Find median from data stream

  - name: Backtracking
    signals:
      - all combinations
      - all permutations
      - generate
      - subset
      - constraint
      - choose
      - undo
    approach: Explore choices, recurse, backtrack by undoing state changes.
    complexity: "Time O(branching^depth), Space O(depth)"
    pitfalls:
      - Forgetting to undo state (duplicate/leak)
      - Not pruning invalid branches early
      - Duplicate results without dedup strategy
    example_problems:
      - Subsets
      - N-queens
      - Combination sum

  - name: Trie
    signals:
      - prefix
      - dictionary
      - autocomplete
      - word search
      - strings
      - lexicographic
    approach: Tree of characters; each node tracks children and end-of-word flag.
    complexity: "Time O(L) per word, Space O(total chars)"
    pitfalls:
      - Not cleaning up nodes on delete
      - Confusing prefix match with full word match
      - Memory heavy for large alphabets
    example_problems:
      - Implement trie
      - Word search II
      - Replace words

  - name: Monotonic Stack
    signals:
      - next greater
      - next smaller
      - daily temperatures
      - histogram
      - span
      - stock
    approach: Stack maintaining increasing or decreasing order; pop when current violates monotonicity.
    complexity: "Time O(n), Space O(n)"
    pitfalls:
      - Pushing/popping wrong elements (index vs value)
      - Using wrong monotonic direction
      - Not handling equal elements per problem spec
    example_problems:
      - Daily temperatures
      - Largest rectangle in histogram
      - Next greater element

  - name: Graph Shortest Path
    signals:
      - weighted
      - dijkstra
      - bellman-ford
      - shortest
      - cheapest
      - network delay
      - negative edge
    approach: Dijkstra for non-negative weights; Bellman-Ford or Floyd-Warshall for negatives or all-pairs.
    complexity: "Dijkstra O((V+E) log V), Bellman-Ford O(VE)"
    pitfalls:
      - Dijkstra with negative edges
      - Not using priority queue for sparse graphs
      - Integer overflow on distance sums
    example_problems:
      - Network delay time
      - Cheapest flights within k stops
      - Path with minimum effort

  - name: Interval Merging
    signals:
      - interval
      - overlap
      - merge
      - meeting rooms
      - schedule
      - range
      - insert
    approach: Sort by start; merge overlapping intervals or use sweep line / min-heap for scheduling.
    complexity: "Time O(n log n), Space O(n)"
    pitfalls:
      - Not sorting before merge
      - Off-by-one on inclusive/exclusive interval ends
      - Confusing merge with intersection
    example_problems:
      - Merge intervals
      - Insert interval
      - Meeting rooms II

  - name: Matrix Marking
    signals:
      - matrix
      - grid
      - zero
      - set
      - mark
      - in-place
      - row
      - column
    approach: Use first row/column or sentinel markers to record state without extra O(m*n) space.
    complexity: "Time O(m*n), Space O(1) with in-place marking"
    pitfalls:
      - Accidentally reading overwritten cells before capture
      - Extra O(m+n) space when O(1) is required
      - Modifying input when copy is expected
    example_problems:
      - Set matrix zeroes
      - Rotate image
      - Spiral matrix

  - name: Bit Manipulation
    signals:
      - xor
      - single number
      - bit
      - power of two
      - subset mask
      - hamming
    approach: Use XOR for cancellation, shifts for powers of two, bitmasks for small-set enumeration.
    complexity: "Time O(1) or O(32), Space O(1)"
    pitfalls:
      - Signed integer shift issues in some languages
      - Forgetting XOR properties (a^a=0)
      - Bitmask bounds when n > 20
    example_problems:
      - Single number
      - Counting bits
      - Subsets via bitmask
